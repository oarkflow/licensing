openapi: 3.0.3
info:
  title: Licensing Service API
  version: 0.2.0
  description: |
    Contract for the licensing platform, including CRM authentication, activation, and
    verification flows that cross-language SDKs must implement.
servers:
  - url: https://localhost:6601
    description: Default development server
components:
  securitySchemes:
    CRMToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token issued by the CRM login endpoint.
  parameters:
    DeviceFingerprintHeader:
      name: X-Device-Fingerprint
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Deterministic SHA-256 hex fingerprint defined in docs/sdk_protocol.md.
    LicenseKeyHeader:
      name: X-License-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Z2-7]{40}$'
      description: Normalized license key (uppercase, hyphenless).
    SecureFlagHeader:
      name: X-License-Secure
      in: header
      required: false
      schema:
        type: string
        enum: ["1"]
      description: Indicates the request body is wrapped in a secure envelope.
    UserAgentHeader:
      name: User-Agent
      in: header
      required: true
      schema:
        type: string
      description: Product/version identifier for logging and rate limiting.
  schemas:
    ActivationRequest:
      type: object
      required: [email, client_id, license_key, device_fingerprint]
      properties:
        email:
          type: string
          format: email
        client_id:
          type: string
          minLength: 1
        license_key:
          type: string
        device_fingerprint:
          type: string
    ActivationResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        encrypted_license:
          type: string
          description: Base64-encoded AES-GCM ciphertext (session key || license JSON).
        nonce:
          type: string
          description: Base64-encoded 12-byte nonce.
        signature:
          type: string
          description: Base64-encoded RSA PKCS#1 v1.5 SHA-256 signature.
        public_key:
          type: string
          description: PEM-encoded RSA public key.
        expires_at:
          type: string
          format: date-time
    SecureEnvelope:
      type: object
      description: Transport wrapper returned when `X-License-Secure: 1` is honored.
      properties:
        nonce:
          type: string
          description: Base64-encoded nonce.
        ciphertext:
          type: string
        tag:
          type: string
      required: [nonce, ciphertext, tag]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CRMLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email, username, or external ID.
        password:
          type: string
          format: password
        mfa_code:
          type: string
          description: Optional TOTP or magic-link code when the account enforces MFA.
        device_id:
          type: string
          description: Client-generated identifier used for risk analysis and session binding.
    CRMLoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in, scope, user, tenant]
      properties:
        access_token:
          type: string
          description: JWT used for subsequent CRM or product API calls.
        refresh_token:
          type: string
          description: Long-lived opaque token scoped to the tenant and device.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds.
        scope:
          type: string
          description: Space-delimited list of granted permissions (e.g. `crm:read licensing:issue`).
        user:
          $ref: '#/components/schemas/CRMUser'
        tenant:
          $ref: '#/components/schemas/CRMTenant'
        products:
          type: array
          items:
            $ref: '#/components/schemas/CRMProductAccess'
    CRMRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
        scope:
          type: string
          description: Optional reduced scope for the new access token; defaults to prior scope.
    CRMRefreshResponse:
      allOf:
        - $ref: '#/components/schemas/CRMLoginResponse'
      description: Mirrors CRMLoginResponse so clients can replace both tokens atomically.
    CRMLogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Token to revoke; when omitted, the caller's active refresh token is revoked.
        device_id:
          type: string
          description: Optional device identifier to target a single session.
    CRMSessionResponse:
      type: object
      required: [user, tenant, scope, issued_at, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/CRMUser'
        tenant:
          $ref: '#/components/schemas/CRMTenant'
        products:
          type: array
          items:
            $ref: '#/components/schemas/CRMProductAccess'
        scope:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CRMUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            description: Role slug, e.g. `owner`, `admin`, `viewer`.
    CRMTenant:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        external_id:
          type: string
          description: Identifier from the upstream CRM or billing platform.
        status:
          type: string
          enum: [active, suspended, trial, archived]
    CRMProductAccess:
      type: object
      required: [product_id, plan_slug]
      properties:
        product_id:
          type: string
        product_name:
          type: string
        plan_slug:
          type: string
        features:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      required: [name, slug, admin_user]
      properties:
        name:
          type: string
        slug:
          type: string
        industry:
          type: string
        region:
          type: string
        billing_email:
          type: string
          format: email
        support_email:
          type: string
          format: email
        metadata:
          type: object
          additionalProperties:
            type: string
        admin_user:
          type: object
          required: [email, username, password]
          properties:
            email:
              type: string
              format: email
            username:
              type: string
            password:
              type: string
              format: password
            role:
              type: string
              description: Optional override of the default `owner` role.
    TenantProductsResponse:
      type: object
      required: [tenant_id, products]
      properties:
        tenant_id:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/CRMProductAccess'
    EntitlementAssignmentRequest:
      type: object
      required: [tenant_id, product_id]
      properties:
        tenant_id:
          type: string
        contact_id:
          type: string
        client_id:
          type: string
        product_id:
          type: string
        plan_id:
          type: string
        plan_slug:
          type: string
        effective_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        notes:
          type: string
        feature_overrides:
          type: object
          additionalProperties:
            type: object
    EntitlementAssignmentResponse:
      type: object
      required: [binding_id, status]
      properties:
        binding_id:
          type: string
        status:
          type: string
          enum: [pending, active]
        message:
          type: string
    DeviceLedgerResponse:
      type: object
      required: [tenant_id, device_fingerprint, last_seen_at]
      properties:
        tenant_id:
          type: string
        client_id:
          type: string
        license_id:
          type: string
        device_fingerprint:
          type: string
        last_seen_at:
          type: string
          format: date-time
        last_sync_at:
          type: string
          format: date-time
        pending_revocation:
          type: boolean
        revocation_epoch:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
    ServiceAccountRequest:
      type: object
      required: [tenant_id, name, scopes]
      properties:
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
        scopes:
          type: array
          items:
            type: string
    ServiceAccountResponse:
      type: object
      required: [id, tenant_id, client_id, secret]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        secret:
          type: string
          description: One-time plaintext credential; store securely.
    OfflineBundleResponse:
      type: object
      required: [license_id, version, bundle]
      properties:
        license_id:
          type: string
        version:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revocation_epoch:
          type: integer
          format: int64
        bundle:
          type: string
          description: Base64-encoded CBOR/JWT payload that can be cached offline.
        signature:
          type: string
          description: Base64-encoded detached signature validating the bundle.
paths:
  /api/crm/login:
    post:
      summary: Sign in to the CRM/product console and obtain tokens.
      tags: [CRM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CRMLoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMLoginResponse'
        '400':
          description: Missing or malformed credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials, MFA failure, or suspended tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Account locked after repeated failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/token:
    post:
      summary: Exchange a refresh token for a new access token pair.
      tags: [CRM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CRMRefreshRequest'
      responses:
        '200':
          description: Tokens refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMRefreshResponse'
        '400':
          description: Missing refresh token or invalid scope request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/logout:
    post:
      summary: Revoke the caller's refresh token or a targeted device session.
      tags: [CRM]
      security:
        - CRMToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CRMLogoutRequest'
      responses:
        '204':
          description: Logout complete; tokens revoked.
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Access token missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/session:
    get:
      summary: Retrieve the authenticated user's current session profile.
      tags: [CRM]
      security:
        - CRMToken: []
      responses:
        '200':
          description: Session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMSessionResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant suspended or insufficient scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/tenants:
    post:
      summary: Provision a tenant together with its first admin user.
      tags: [CRM]
      security:
        - CRMToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMTenant'
        '400':
          description: Missing required fields or invalid admin seed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tenant slug or admin email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/tenants/{tenantId}/products:
    get:
      summary: List product plans assigned to a tenant including feature scopes.
      tags: [CRM]
      security:
        - CRMToken: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product entitlements for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProductsResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found or inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/entitlements:
    post:
      summary: Assign or update a plan for a tenant/contact pair.
      tags: [CRM]
      security:
        - CRMToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementAssignmentRequest'
      responses:
        '202':
          description: Entitlement accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementAssignmentResponse'
        '400':
          description: Invalid tenant, plan, or effective dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/devices/{fingerprint}:
    get:
      summary: Inspect the ledger entry for a device fingerprint.
      tags: [CRM]
      security:
        - CRMToken: []
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ledger record returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLedgerResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device fingerprint unknown for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/crm/service-accounts:
    post:
      summary: Create a scoped service account credential for automation.
      tags: [CRM]
      security:
        - CRMToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountRequest'
      responses:
        '201':
          description: Service account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
        '400':
          description: Invalid scope request or missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Service account name already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/licensing/offline/bundles/{licenseId}:
    get:
      summary: Retrieve the latest offline verification bundle for a license.
      tags: [Licensing]
      security:
        - CRMToken: []
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
        - name: revocation_epoch
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Last revocation epoch the client has processed; used for delta responses.
      responses:
        '200':
          description: Bundle ready for download.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBundleResponse'
        '401':
          description: Access token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: License not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/activate:
    post:
      summary: Activate a device for a license key.
      tags: [Client]
      parameters:
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/DeviceFingerprintHeader'
        - $ref: '#/components/parameters/LicenseKeyHeader'
        - $ref: '#/components/parameters/SecureFlagHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: License activated successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActivationResponse'
                  - $ref: '#/components/schemas/SecureEnvelope'
              examples:
                plaintext:
                  summary: Direct JSON response
                  value:
                    success: true
                    message: Activated
                    encrypted_license: BASE64...
                    nonce: BASE64...
                    signature: BASE64...
                    public_key: "-----BEGIN PUBLIC KEY-----\n..."
                secure:
                  summary: Secure envelope response
                  value:
                    nonce: BASE64...
                    ciphertext: BASE64...
                    tag: BASE64...
        '400':
          description: Invalid request contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized, banned client, or revoked license.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: License not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Activation limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/verify:
    post:
      summary: Verify an existing device/license pairing.
      tags: [Client]
      parameters:
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/DeviceFingerprintHeader'
        - $ref: '#/components/parameters/LicenseKeyHeader'
        - $ref: '#/components/parameters/SecureFlagHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: Verification succeeded.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActivationResponse'
                  - $ref: '#/components/schemas/SecureEnvelope'
        '400': { $ref: '#/paths/~1api~1activate/post/responses/400' }
        '401': { $ref: '#/paths/~1api~1activate/post/responses/401' }
        '404': { $ref: '#/paths/~1api~1activate/post/responses/404' }
        '409': { $ref: '#/paths/~1api~1activate/post/responses/409' }
        '429': { $ref: '#/paths/~1api~1activate/post/responses/429' }
        '500': { $ref: '#/paths/~1api~1activate/post/responses/500' }
