services:
  licensing:
    image: licensing-server:latest
    restart: unless-stopped
    user: "licensing"
    ports:
      - "127.0.0.1:6601:6601"
    environment:
      APP_ENV: "production"
      LICENSE_SERVER_HTTP_ADDR: ":6601"
      LICENSE_SERVER_ALLOW_INSECURE_HTTP: "true"
      LICENSE_SERVER_TLS_TERMINATED_BY_PROXY: "true"
      LICENSE_SERVER_STORAGE: "sqlite"
      LICENSE_SERVER_STORAGE_SQLITE_PATH: "/data/licensing.db"
      LICENSE_SERVER_AUDIT_DB_PATH: "/data/audit.db"
      LICENSE_SERVER_BACKUP_MARKER_FILE: "/backups/latest.json"
      LICENSE_SERVER_METRICS_ENABLED: "true"
      LICENSE_SERVER_AUDIT_ENABLED: "true"
      LICENSE_SERVER_ALLOW_LEGACY_ENV_KEYS_IN_PROD: "false"
      # Strongly recommended: use file/tpm provider in production.
      # LICENSE_SERVER_KEY_PROVIDER: "file"
      # LICENSE_SERVER_KEY_FILE: "/certs/signing.key"
      # Legacy env API keys are break-glass only. Create stored scoped API keys in the Admin UI/API.
      # LICENSE_SERVER_API_KEYS: "break-glass-key"
    volumes:
      - licensing_data:/data
      - licensing_backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6601/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  licensing_data:
  licensing_backups:
