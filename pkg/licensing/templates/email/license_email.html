<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>License for {{.ClientName}}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            border-radius: 8px;
            border: 1px solid #eaeaea;
            padding: 20px;
        }

        .pre {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>License for {{.ClientName}}</h1>
            <p>Hi {{.ClientName}},</p>
            <p>Here is your license for <strong>{{.ProductName}}</strong> on the <strong>{{.PlanName}}</strong> plan.
            </p>
            <div class="pre">{{.LicenseJSON}}</div>
            <p>Expires: {{.Year}}</p>
        </div>
    </div>
</body>

</html>
