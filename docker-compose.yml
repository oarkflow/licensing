services:
  crm:
    build:
      context: .
    container_name: crm
    restart: unless-stopped

    # Expose port properly
    ports:
      - "6601:6601"

    environment:
      LICENSE_SERVER_HTTP_ADDR: ":6601"
      LICENSE_SERVER_STORAGE: "sqlite"
      LICENSE_SERVER_STORAGE_SQLITE_PATH: "/data/licensing.db"

    volumes:
      - crm-data:/data

    networks:
      - crm

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:6601/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  crm:
    driver: bridge
